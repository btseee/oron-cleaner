# Pinned transitive closure of pyproject.toml's dependencies, resolved for
# Python 3.12 -- the version the RunPod PyTorch image ships and the only one the
# 24-48 h corpus pass will ever run on.
#
# Why this file exists: every dependency was declared with `>=` and no ceiling,
# so a transformers, torch or datasets release could silently change what the
# gates measure, with no signal and no way to tell two runs apart afterwards.
# The filter thresholds are hashed into FILTER_POLICY_VERSION; the model and
# library versions that implement them were not pinned at all.
#
#   uv pip install -r requirements.lock
#   pip install -e ../oron-tts        # text normalisation, not on PyPI
#
# oron-tts is deliberately absent: it is a sibling repo rather than a published
# package, so it cannot be resolved here. It is pure stdlib and pulls nothing.
#
# Regenerate:
#   uv pip compile <deps> --python-version 3.12 --no-header -o requirements.lock

